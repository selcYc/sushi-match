<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>寿司插图一览</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    main { padding-bottom: 40px; }
    h2 { font-size: 1rem; margin: 28px 0 10px; }
    .intro { margin: 0; color: var(--muted); font-size: 0.875rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
    .card { background: var(--porcelain); border-radius: 6px; padding: 8px 8px 10px; text-align: center; color: #1c2b36; }
    .card img { width: 100%; display: block; }
    .card b { font-family: var(--kana-font); font-size: 1.0625rem; }
    .card small { display: block; color: #5c6b75; }
  </style>
</head>
<body>
  <header class="noren"><h1>寿司插图一览</h1></header>
  <div class="belt" aria-hidden="true"></div>
  <main>
    <p class="intro">题库里全部的图，按分类排。图由 tools/draw_sushi.py 生成。</p>
    <div id="list"></div>
  </main>
  <script>
    fetch("data/words.json").then((r) => r.json()).then(({ categories, words }) => {
      const list = document.getElementById("list");
      for (const c of categories) {
        const h = document.createElement("h2");
        h.textContent = c.zh;
        const grid = document.createElement("div");
        grid.className = "grid";
        for (const w of words.filter((w) => w.cat === c.id)) {
          const card = document.createElement("div");
          card.className = "card";
          card.innerHTML = `<img alt=""><b lang="ja"></b><small></small>`;
          card.querySelector("img").src = `img/sushi/${w.id}.svg?v=${Date.now()}`;
          card.querySelector("b").textContent = w.kana;
          card.querySelector("small").textContent = w.zh;
          grid.append(card);
        }
        list.append(h, grid);
      }
    });
  </script>
</body>
</html>
