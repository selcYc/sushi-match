<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>插图新旧对比</title>
  <link rel="stylesheet" href="style.css">
  <style>
    main { padding-bottom: 40px; }
    h2 { font-size: 1rem; margin: 24px 0 8px; }
    .intro { margin: 0; color: var(--muted); font-size: 0.875rem; }
    .row { display: grid; grid-template-columns: 5.5em 1fr 1fr; gap: 10px; align-items: center; margin-bottom: 10px; }
    .row b { font-family: var(--kana-font); }
    .row small { display: block; color: var(--muted); }
    .cell { background: var(--porcelain); border-radius: 6px; padding: 6px; }
    .cell img { width: 100%; display: block; }
    .head { color: var(--muted); font-size: 0.8125rem; }
    .game { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .game div { text-align: center; font-size: 0.75rem; color: var(--muted); }
    .game img { width: 100%; height: 62px; object-fit: contain; display: block; }
  </style>
</head>
<body>
  <header class="noren"><h1>插图新旧对比</h1></header>
  <div class="belt" aria-hidden="true"></div>
  <main>
    <p class="intro">左边是现在的图，右边是新画法的样稿（约 30° 视角、叶片形鱼片、细描边）。</p>
    <h2>大图</h2>
    <div class="row head"><span></span><span>现在</span><span>新样稿</span></div>
    <div id="rows"></div>
    <h2>游戏里的实际大小（新样稿）</h2>
    <div class="game" id="game"></div>
  </main>
  <script>
    const items = [
      ["maguro", "まぐろ", "金枪鱼"], ["hamachi", "はまち", "油甘鱼"], ["hirame", "ひらめ", "比目鱼"],
      ["ika", "いか", "鱿鱼"], ["unagi", "うなぎ", "鳗鱼"], ["anago", "あなご", "星鳗"],
    ];
    const v = Date.now();
    for (const [id, kana, zh] of items) {
      document.getElementById("rows").insertAdjacentHTML("beforeend",
        `<div class="row"><span><b lang="ja">${kana}</b><small>${zh}</small></span>
         <div class="cell"><img src="img/sushi/${id}.svg?v=${v}" alt=""></div>
         <div class="cell"><img src="img/sushi-v2/${id}.svg?v=${v}" alt=""></div></div>`);
      document.getElementById("game").insertAdjacentHTML("beforeend",
        `<div><img src="img/sushi-v2/${id}.svg?v=${v}" alt=""><span lang="ja">${kana}</span></div>`);
    }
  </script>
</body>
</html>
